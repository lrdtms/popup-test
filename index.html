<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dispenser Status</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Dispenser Status</h1>
    <div class="buttons">
      <button id="btn1">Refill</button>
      <button id="btn2">Empty</button>
    </div>
  </main>

  <dialog id="popup1">
    <h2>Refill</h2>
    <p>Dispenser marked as refilled.</p>
    <button class="close">Close</button>
  </dialog>

  <dialog id="popup2">
    <h2>Empty</h2>
    <p>Dispenser marked as empty.</p>
    <button class="close">Close</button>
  </dialog>

  <script src="script.js"></script>
</body>
</html>
